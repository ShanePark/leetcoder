[package]
name = "leetcoder"
version = "0.1.0"
description = "A focused LeetCode Java practice editor."
authors = ["shane"]
edition = "2021"

[lib]
name = "leetcoder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = { version = "2.7.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2.4.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
quick-xml = "0.41.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
