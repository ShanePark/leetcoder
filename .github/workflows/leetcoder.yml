name: leetcoder

on:
  # Only the main branch is gated: pull requests that target it, and the
  # pushes that land when one merges. Work in progress on a topic branch
  # does not need a full two-platform bundle on every commit.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-bundle:
    name: Verify and bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Install Ubuntu Tauri dependencies
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test

      - name: Check Rust
        working-directory: src-tauri
        run: cargo check

      - name: Build native Tauri bundle
        run: npm run tauri -- build

      - name: Upload native bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: leetcoder-${{ matrix.os }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
